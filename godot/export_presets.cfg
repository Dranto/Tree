; Presets d'export (tools/export.sh). Quatre presets : jeu et démo, Windows et Linux x86_64.
; La démo porte la fonctionnalité « demo » (Game.is_demo()). Les binaires vont dans build/.
; Sans signature de code (voir docs/export.md). PCK embarqué : un seul fichier par plateforme.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="autotest/*, tests/*, tools/*"
export_path="../build/windows/Arborescence.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/icon="res://assets/icon/icon.ico"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.13.0.0"
application/product_version="0.13.0.0"
application/company_name=""
application/product_name="Arborescence"
application/file_description="Arborescence"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true

