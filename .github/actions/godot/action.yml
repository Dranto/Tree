# Préparation commune des jobs Godot : écran virtuel et rendu logiciel (mesa à jour, comme les
# références des tests visuels), binaire de Godot 4.7 en cache.
name: Préparer Godot
description: Installe xvfb et mesa (rendu logiciel) et restaure le binaire de Godot en cache.
inputs:
  export-templates:
    description: Mettre aussi en cache les modèles d'export (builds).
    default: "false"
runs:
  using: composite
  steps:
    - name: Installer l'écran virtuel et le rendu logiciel
      shell: bash
      run: |
        # Machine GPU (runner auto-hébergé, docs/gpu-ovh.md) : tout est déjà installé par
        # tools/gpu/setup.sh, et son utilisateur n'a pas sudo.
        if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
          command -v xvfb-run > /dev/null && command -v ffmpeg > /dev/null && exit 0
          echo "Machine auto-hébergée sans xvfb ou ffmpeg : relancer tools/gpu/setup.sh"; exit 1
        fi
        # packages.microsoft.com répond parfois 403 depuis les machines de GitHub (seul dépôt inutile ici) :
        # on l'écarte, puis on retente une fois si un autre dépôt est indisponible.
        sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources \
          /etc/apt/sources.list.d/azure*.list /etc/apt/sources.list.d/azure*.sources 2>/dev/null || true
        for try in 1 2 3; do
          sudo apt-get update -q && break
          echo "apt-get update a échoué (essai $try), nouvel essai"; sleep 5
        done
        for try in 1 2 3; do
          sudo apt-get install -yq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 && break
          echo "apt-get install a échoué (essai $try), nouvel essai"; sleep 5
        done
        command -v xvfb-run > /dev/null

    - name: Cache de Godot
      if: inputs.export-templates != 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/godot
        key: godot-4.7-stable

    - name: Cache de Godot et des modèles d'export
      if: inputs.export-templates == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/godot
          ~/.local/share/godot/export_templates
        key: godot-export-4.7-stable
