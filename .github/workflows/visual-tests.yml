# Tests visuels : rejoue des parties à l'identique et compare les captures du jeu
# et de l'arbre aux références (godot/tests/visual/reference/).
# L'artefact « tests-visuels » contient toujours les captures, les écarts et rapport.html ;
# le résumé du job (onglet Summary) liste chaque capture et chaque défaut d'interface détecté.
#
# Lancé à la main avec « references » (tools/refs-from-ci.sh --in-ci <branche>), le workflow prend les
# captures changées de la CI comme nouvelles références, les commite sur la branche, puis relance les
# tests visuels sur ce commit pour le vérifier : plus besoin de tools/visual-tests.sh --update en local
# après un rebase (10 minutes, et le rendu d'une autre machine diffère un peu de celui de la CI).
name: Tests visuels

on:
  pull_request:
    # Documentation seule : rien à tester.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "prototype-web/**"
      - ".claude/**"
  push:
    branches: [main, master, develop, "claude/project-thread-9liy48"]
  workflow_dispatch:
    inputs:
      references:
        description: "Prendre les captures changées comme références et les commiter sur la branche"
        type: boolean
        default: false

# Un nouveau push sur une PR annule les jobs en cours de l'ancien commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Quatre parts jouées en parallèle (tools/visual-tests.sh, SHARD=k/4) : environ 3 minutes de
  # scénarios chacune (6 minutes 30 avec deux parts, 26/11), loin du plafond de 10 minutes.
  # Le job « rapport » réunit ensuite les captures dans un seul rapport.
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/godot

      - name: Comparer les captures (part ${{ matrix.shard }} sur 4)
        run: SHARD=${{ matrix.shard }}/4 tools/visual-tests.sh

      - name: Résumé du job
        if: always()
        run: |
          if [ -f godot/tests/visual/out/resume.md ]; then
            cat godot/tests/visual/out/resume.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Le plafond vaut pour chaque part : 10 minutes, comme l'ancien job unique.
      - name: Durée sous 10 minutes
        run: |
          total=$(awk '{s+=$3} END{print s}' godot/tests/visual/out/durees.txt)
          echo "Durée des scénarios de la part : ${total} s"
          [ "$total" -le 600 ] || { echo "Plus de 10 minutes : alléger les scénarios ou ajouter une part"; exit 1; }

      - name: Publier les captures de la part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-visuels-part-${{ matrix.shard }}
          path: godot/tests/visual/out/
          if-no-files-found: ignore

  # Un seul rapport (rapport.html, résumé) pour toutes les parts, avec les références.
  rapport:
    needs: visual
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les parts
        uses: actions/download-artifact@v4
        with:
          pattern: tests-visuels-part-*
          path: parts

      - name: Réunir les captures et refaire le rapport
        run: |
          out=godot/tests/visual/out
          mkdir -p "$out"
          for d in parts/*/; do
            for f in results.txt audit.txt durees.txt; do
              [ -f "$d$f" ] && cat "$d$f" >> "$out/$f"
            done
            find "$d" -maxdepth 1 -name '*.png' -exec cp {} "$out/" \;
          done
          tools/visual-tests.sh --report || true
          cat "$out/resume.md" >> "$GITHUB_STEP_SUMMARY"
          echo "Le rapport HTML complet est dans l'artefact « tests-visuels » (rapport.html)." >> "$GITHUB_STEP_SUMMARY"

      - name: Publier les captures et le rapport
        uses: actions/upload-artifact@v4
        with:
          name: tests-visuels
          path: |
            godot/tests/visual/out/
            godot/tests/visual/reference/
          if-no-files-found: ignore

  # Seulement sur demande (workflow_dispatch, references) : les captures changées deviennent les
  # références de la branche. Jamais sur develop ni main : ces branches ne reçoivent que des fusions.
  references:
    needs: visual
    if: always() && github.event_name == 'workflow_dispatch' && inputs.references && github.ref_name != 'develop' && github.ref_name != 'main' && github.ref_name != 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les parts
        uses: actions/download-artifact@v4
        with:
          pattern: tests-visuels-part-*
          path: parts

      - name: Copier les captures changées dans les références
        id: copie
        run: |
          ref=godot/tests/visual/reference
          n=0
          while read -r name status _; do
            case "$status" in ok|maj) continue ;; esac
            src=$(ls parts/*/"$name.png" 2>/dev/null | head -1)
            [ -n "$src" ] || { echo "$name ($status) : capture absente, ignorée"; continue; }
            cp "$src" "$ref/$name.png"
            echo "- $name ($status)" | tee -a liste.md
            n=$((n + 1))
          done < <(cat parts/*/results.txt 2>/dev/null)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          { echo "### Références prises dans la CI : $n"; cat liste.md 2>/dev/null || true; } >> "$GITHUB_STEP_SUMMARY"

      # Un push fait avec le jeton du workflow ne relance aucun workflow : les tests visuels sont
      # relancés à la main sur le nouveau commit, pour vérifier que tout correspond.
      - name: Commiter, pousser et revérifier
        if: steps.copie.outputs.n != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot/tests/visual/reference
          git commit -m "Références visuelles prises dans la CI (${{ steps.copie.outputs.n }} captures, run ${{ github.run_id }})"
          git push origin "HEAD:${{ github.ref_name }}"
          gh workflow run visual-tests.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
