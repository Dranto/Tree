# Tests visuels : rejoue des parties à l'identique et compare les captures du jeu
# et de l'arbre aux références (godot/tests/visual/reference/).
# L'artefact « tests-visuels » contient toujours les captures, les écarts et rapport.html ;
# le résumé du job (onglet Summary) liste chaque capture et chaque défaut d'interface détecté.
name: Tests visuels

on:
  pull_request:
  push:
    branches: [main, master, "claude/project-thread-9liy48"]
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Installer l'écran virtuel et le rendu logiciel
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb libgl1-mesa-dri libglx-mesa0 libegl1

      - name: Cache de Godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot
          key: godot-4.3-stable

      - name: Comparer les captures
        run: tools/visual-tests.sh

      - name: Résumé du job
        if: always()
        run: |
          if [ -f godot/tests/visual/out/resume.md ]; then
            cat godot/tests/visual/out/resume.md >> "$GITHUB_STEP_SUMMARY"
            echo "Le rapport HTML complet est dans l'artefact « tests-visuels » (rapport.html)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Durée sous 5 minutes
        run: |
          total=$(awk '{s+=$3} END{print s}' godot/tests/visual/out/durees.txt)
          echo "Durée des scénarios : ${total} s"
          [ "$total" -le 300 ] || { echo "Plus de 5 minutes : alléger les scénarios"; exit 1; }

      - name: Publier les captures et le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-visuels
          path: |
            godot/tests/visual/out/
            godot/tests/visual/reference/
          if-no-files-found: ignore
