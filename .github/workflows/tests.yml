# Tests de logique : chaque godot/tests/*_test.gd (sauf les robots longs aventure et zone),
# en parallèle, chacun avec son propre dossier user:// (tools/unit-tests.sh). Les tests qui ont
# besoin d'un écran (direct_screen, draw_batch, move, tree_ui) tournent sous xvfb.
name: Tests de logique

on:
  pull_request:
    # Documentation seule : rien à tester.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "prototype-web/**"
      - ".claude/**"
  push:
    branches: [main, master, develop, "claude/project-thread-9liy48"]
  workflow_dispatch:

# Un nouveau push sur une PR annule les jobs en cours de l'ancien commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Deux parts jouées en parallèle (tools/unit-tests.sh, SHARD=k/2, réparties selon la durée de
  # chaque test) : environ 2 minutes 30 de tests chacune au lieu de 5 minutes pour un seul job.
  tests:
    name: tests (part ${{ matrix.shard }} sur 2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/godot

      - name: Catalogues de traduction à jour, aucun texte hors traduction
        if: matrix.shard == 1
        run: tools/i18n.sh --check

      - name: Anglais complet (100 %, gabarits identiques)
        if: matrix.shard == 1
        run: tools/i18n.sh --complete en

      - name: Lancer les tests (part ${{ matrix.shard }} sur 2)
        run: SHARD=${{ matrix.shard }}/2 tools/unit-tests.sh

      - name: Résumé du job
        if: always()
        run: |
          [ -f godot/tests/unit-out/resume.md ] && cat godot/tests/unit-out/resume.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publier les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-logique-part-${{ matrix.shard }}
          path: |
            godot/tests/unit-out/*.log
            godot/tests/unit-out/resume.md
          if-no-files-found: ignore
