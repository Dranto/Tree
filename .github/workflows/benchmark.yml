# Garde-fou de performance : le banc de jeu (120 Flétris, rendu logiciel) doit rester dans son
# budget de temps par image (tools/bench.sh, docs/performances.md).
name: Banc de performance

on:
  pull_request:
  push:
    branches: [main, master, develop, "claude/project-thread-9liy48"]
  workflow_dispatch:

# Budgets du banc des pics sur la machine de la CI (docs/performances.md).
env:
  COEUR_BUDGET_MS: 45
  COEUR_P99_MS: 90
  SIX_BUDGET_MS: 34
  FINALE_BUDGET_MS: 36
  FINALE_P99_MS: 50

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Installer l'écran virtuel et le rendu logiciel
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb libgl1-mesa-dri libglx-mesa0 libegl1

      - name: Cache de Godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot
          key: godot-4.7-stable

      # pipefail : sans lui, « | tee » rendait le code de tee et un dépassement passait inaperçu.
      - name: Banc de jeu (meilleure de 2 mesures)
        shell: bash
        run: |
          set -o pipefail
          RUNS=2 tools/bench.sh | tee bench.txt

      - name: Banc des pics, siège du Cœur (meilleure de 2 mesures)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          SCENE=coeur RUNS=2 BUDGET_MS=${{ env.COEUR_BUDGET_MS }} P99_MS=${{ env.COEUR_P99_MS }} tools/bench.sh | tee bench_coeur.txt

      # Monde à six régions (régions factices de tests/regions/ : Racine, tant qu'elle n'est pas écrite).
      - name: Banc à six régions (120 Flétris, meilleure de 2 mesures)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          REGIONS=six RUNS=2 BUDGET_MS=${{ env.SIX_BUDGET_MS }} tools/bench.sh | tee bench_six.txt

      - name: Banc des pics à six régions, siège du Cœur (meilleure de 2 mesures)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          REGIONS=six SCENE=coeur RUNS=2 BUDGET_MS=${{ env.COEUR_BUDGET_MS }} P99_MS=${{ env.COEUR_P99_MS }} tools/bench.sh | tee bench_six_coeur.txt

      # Finale : l'arène sous la graine et le colosse, à six régions (le monde entier est purifié).
      - name: Banc de la finale, arène et colosse (meilleure de 2 mesures)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          REGIONS=six SCENE=finale RUNS=2 BUDGET_MS=${{ env.FINALE_BUDGET_MS }} P99_MS=${{ env.FINALE_P99_MS }} tools/bench.sh | tee bench_finale.txt

      - name: Résumé du job
        if: always()
        run: |
          {
            echo "### Banc de performance"
            echo '```'
            cat bench.txt 2>/dev/null
            echo '```'
            echo "### Banc des pics (siège du Cœur)"
            echo '```'
            cat bench_coeur.txt 2>/dev/null
            echo '```'
            echo "### Banc à six régions"
            echo '```'
            cat bench_six.txt 2>/dev/null
            cat bench_six_coeur.txt 2>/dev/null
            echo '```'
            echo "### Banc de la finale"
            echo '```'
            cat bench_finale.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
