# Garde-fou de performance : le banc de jeu (120 Flétris, rendu logiciel) doit rester dans son
# budget de temps par image (tools/bench.sh, docs/performances.md).
# Seuls les bancs en paires (banc de jeu 1600×900 et 1280×800 contre la branche visée, sur une PR)
# font échouer le job : la machine de la CI est lente et varie de ±15 %, un budget fixe y donne de
# faux rouges. Les autres bancs (pics du Cœur, six régions, finale) et les bancs de jeu d'un push
# (sans base à comparer) sont mesurés pour information (INFO_ONLY=1) : leurs chiffres restent dans
# le résumé du job. Une erreur de script ou un banc sans résultat échoue toujours.
name: Banc de performance

on:
  pull_request:
  push:
    branches: [main, master, develop, "claude/project-thread-9liy48"]
  workflow_dispatch:

# Budgets du banc des pics sur la machine de la CI (docs/performances.md).
env:
  COEUR_BUDGET_MS: 45
  COEUR_P99_MS: 90
  SIX_BUDGET_MS: 34
  FINALE_BUDGET_MS: 36
  FINALE_P99_MS: 50

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Installer l'écran virtuel et le rendu logiciel
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb libgl1-mesa-dri libglx-mesa0 libegl1

      - name: Cache de Godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot
          key: godot-4.7-stable

      # La vitesse de la machine de la CI varie de ±15 % d'un job à l'autre (27,5 puis 31,5 ms pour le
      # même code, 24/11) : sur une PR, le banc de jeu est mesuré en paires avec la branche visée.
      - name: Préparer la base de la PR (mesure en paires)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git worktree add ../base FETCH_HEAD

      # pipefail : sans lui, « | tee » rendait le code de tee et un dépassement passait inaperçu.
      - name: Banc de jeu (meilleure de 2 mesures, en paires avec la base sur une PR)
        shell: bash
        run: |
          set -o pipefail
          if [ -d ../base ]; then export BASE_DIR=../base; else export INFO_ONLY=1; fi
          RUNS=2 tools/bench.sh | tee bench.txt

      # Même banc dans une fenêtre de 1280×800 (écran courant des portables et du Steam Deck) : le
      # rendu logiciel coûte au pixel, il doit tenir dans le même budget.
      - name: Banc de jeu en 1280×800 (meilleure de 2 mesures, en paires avec la base sur une PR)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          if [ -d ../base ]; then export BASE_DIR=../base; else export INFO_ONLY=1; fi
          RESOLUTION=1280x800 RUNS=2 tools/bench.sh | tee bench_1280.txt

      - name: Banc des pics, siège du Cœur (meilleure de 2 mesures, pour information)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          INFO_ONLY=1 SCENE=coeur RUNS=2 BUDGET_MS=${{ env.COEUR_BUDGET_MS }} P99_MS=${{ env.COEUR_P99_MS }} tools/bench.sh | tee bench_coeur.txt

      # Monde à six régions (régions factices de tests/regions/ : Racine, tant qu'elle n'est pas écrite).
      - name: Banc à six régions (120 Flétris, meilleure de 2 mesures, pour information)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          INFO_ONLY=1 REGIONS=six RUNS=2 BUDGET_MS=${{ env.SIX_BUDGET_MS }} tools/bench.sh | tee bench_six.txt

      - name: Banc des pics à six régions, siège du Cœur (meilleure de 2 mesures, pour information)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          REGIONS=six INFO_ONLY=1 SCENE=coeur RUNS=2 BUDGET_MS=${{ env.COEUR_BUDGET_MS }} P99_MS=${{ env.COEUR_P99_MS }} tools/bench.sh | tee bench_six_coeur.txt

      # Finale : l'arène sous la graine et le colosse, à six régions (le monde entier est purifié).
      - name: Banc de la finale, arène et colosse (meilleure de 2 mesures, pour information)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          INFO_ONLY=1 REGIONS=six SCENE=finale RUNS=2 BUDGET_MS=${{ env.FINALE_BUDGET_MS }} P99_MS=${{ env.FINALE_P99_MS }} tools/bench.sh | tee bench_finale.txt

      - name: Résumé du job
        if: always()
        run: |
          {
            echo "### Banc de performance"
            echo '```'
            cat bench.txt 2>/dev/null
            echo '```'
            echo "### Banc de jeu en 1280×800"
            echo '```'
            cat bench_1280.txt 2>/dev/null
            echo '```'
            echo "### Banc des pics (siège du Cœur)"
            echo '```'
            cat bench_coeur.txt 2>/dev/null
            echo '```'
            echo "### Banc à six régions"
            echo '```'
            cat bench_six.txt 2>/dev/null
            cat bench_six_coeur.txt 2>/dev/null
            echo '```'
            echo "### Banc de la finale"
            echo '```'
            cat bench_finale.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
